# MC-Dashboard – Werte kommen aus der Datei .env im selben Ordner (siehe .env.example).
# Für den Synology Container Manager gibt es im README eine Variante zum Einfügen.
services:
  mc-dashboard:
    image: ghcr.io/irgendeinjohan/mcrcondocker:latest
    # Alternativ selbst bauen (Ordner enthält den Quellcode): Zeile oben auskommentieren, diese aktivieren
    # build: .
    container_name: mc-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # innerhalb des Containers immer 8080; außen über DASHBOARD_PORT
      PORT: "8080"
      DATA_DIR: /data
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      # Datenbank; optional Texturen/Sprachdatei in ./data/assets
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
